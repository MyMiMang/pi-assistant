# 每周把 Hindsight（高级记忆）升级到最新版：跑 typecheck、全部单测、Hindsight 真机冒烟（真装、真启动、Mock 模型）；
# 通过就自动开 PR（附测试结果），失败就开 issue。与 pi-latest.yml 同一套流程：上游的修复和新功能自动进来，
# 适配只在 packages/server/src/memory/hindsight 和 llm-proxy.ts，不改 Hindsight 本身。
name: hindsight-latest
on:
  schedule: [{ cron: "0 3 * * 1" }]   # 每周一 11:00（北京时间），错开 pi-latest
  workflow_dispatch: {}
permissions: { contents: write, pull-requests: write, issues: write }
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - id: bump
        name: 升级 Hindsight 到最新版（Python + npm 一致 + 同步版本记录）
        run: |
          BEFORE=$(node -e "import('./scripts/hindsight-update.mjs').then(m=>console.log(m.pinnedVersion()))")
          node scripts/hindsight-update.mjs latest
          AFTER=$(node -e "import('./scripts/hindsight-update.mjs').then(m=>console.log(m.pinnedVersion()))")
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"; echo "after=$AFTER" >> "$GITHUB_OUTPUT"
      - name: 测试
        if: steps.bump.outputs.before != steps.bump.outputs.after
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/test.log
          npm test 2>&1 | tee -a /tmp/test.log
          node --test scripts/hindsight-update.test.mjs 2>&1 | tee -a /tmp/test.log
          cd packages/server && PIA_HS_SMOKE_DIR=/tmp/pia-hs-smoke node --import tsx test/hindsight.smoke.ts 2>&1 | tee -a /tmp/test.log
      - uses: peter-evans/create-pull-request@v7
        if: steps.bump.outputs.before != steps.bump.outputs.after && steps.test.outcome == 'success'
        with:
          branch: deps/hindsight-${{ steps.bump.outputs.after }}
          title: "deps: 升级 Hindsight ${{ steps.bump.outputs.before }} → ${{ steps.bump.outputs.after }}"
          body: "自动升级。typecheck、单元测试、Hindsight 真机冒烟（安装 → 启动 → 写入 → 抽取 → 召回 → 反思 → 重启）全部通过。用户更新 App 后附属进程会按新的 pyproject 自动重装。合并前看一眼上游 changelog 里的 Breaking Changes：https://hindsight.vectorize.io/changelog"
          commit-message: "deps: 升级 Hindsight 到 ${{ steps.bump.outputs.after }}"
      - name: 测试失败 → 开 issue
        if: steps.bump.outputs.before != steps.bump.outputs.after && steps.test.outcome != 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --title "Hindsight ${{ steps.bump.outputs.after }} 兼容性测试失败" \
            --body "$(printf '升级 Hindsight %s → %s 后测试失败，需要调整 packages/server/src/memory/hindsight（或 llm-proxy.ts）。\n\n```\n%s\n```' '${{ steps.bump.outputs.before }}' '${{ steps.bump.outputs.after }}' "$(tail -n 80 /tmp/test.log)")"
