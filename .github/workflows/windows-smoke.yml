# Windows 安装包冒烟：静默安装真实的 setup.exe，像用户一样启动托盘程序，确认内置服务能在 127.0.0.1:8787 上线。
# 另外用安装目录里的 node.exe 以托盘相同的参数直接跑一次服务，把输出打到日志和注解里，便于排查。
# 触发：release.yml 在公开前用刚构建的安装包调用（artifact）；也可手动选 tag 运行；改本文件时对最新 Release 和 beta.8 各跑一次。
name: windows-smoke
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag（留空 = latest）", required: false }
  workflow_call:
    inputs:
      tag: { type: string, required: false }
      artifact: { type: string, required: false, description: "同一次运行里刚构建的安装包 artifact 名（发版流程用，安装包还在草稿里）" }
  push:
    branches: [main]
    paths: [".github/workflows/windows-smoke.yml"]
permissions: { contents: read }
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 改本文件时顺带对比上一个已知能用的版本；其他触发只测指定 tag
        tag: ${{ fromJSON(github.event_name == 'push' && !inputs.artifact && github.workflow == 'windows-smoke' && '["", "v0.1.0-beta.8"]' || '["-"]') }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ matrix.tag == '-' && inputs.tag || matrix.tag }}
    steps:
      - uses: actions/download-artifact@v4
        if: inputs.artifact
        with: { name: "${{ inputs.artifact }}", path: art }
      - name: Download setup.exe
        shell: bash
        run: |
          if [ -n "${{ inputs.artifact }}" ]; then cp "$(find art -name '*-setup.exe' | head -1)" setup.exe; echo "TAG=artifact" >> "$GITHUB_ENV"; exit 0; fi
          if [ -z "$TAG" ]; then TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*x64-setup.exe' -O setup.exe
      - name: Silent install
        shell: pwsh
        run: |
          # 装到带中文和空格的目录，数据目录也放到中文路径下（模拟中文用户名）
          $dir = 'C:\测试 用户\Pi Assistant'
          Start-Process -Wait -FilePath .\setup.exe -ArgumentList '/S', "/D=$dir"
          if (-not (Test-Path "$dir\pi-assistant-tray.exe")) { $dir = Join-Path $env:LOCALAPPDATA 'Pi Assistant' }
          Get-ChildItem $dir | Format-Table Name, Length
          "INSTALL=$dir" | Out-File -Append $env:GITHUB_ENV
      - name: Direct server run (same args as tray)
        shell: pwsh
        run: |
          $app = Join-Path $env:INSTALL 'app'
          $env:APPDATA = 'C:\测试 用户\Roaming'
          $env:PIA_APP_DIR = $app; $env:PIA_PORT = '18787'; $env:PIA_LAUNCHER = 'tray'
          $p = Start-Process -PassThru -NoNewWindow -WorkingDirectory $app -FilePath (Join-Path $env:INSTALL 'node.exe') `
            -ArgumentList '--disable-warning=ExperimentalWarning','--import','tsx',"`"$app\packages\server\src\main.ts`"" `
            -RedirectStandardOutput direct.out -RedirectStandardError direct.err
          $ok = $false
          for ($i = 0; $i -lt 120 -and -not $ok; $i++) {
            Start-Sleep 1
            if ($p.HasExited) { break }
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18787/api/system/public -TimeoutSec 3).StatusCode -eq 200 } catch {}
          }
          $log = (Get-Content direct.out, direct.err -Raw -ErrorAction SilentlyContinue) -join "`n"
          Write-Output $log
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) {
            $t = $log.Substring([Math]::Max(0, $log.Length - 3000)) -replace "`r?`n", '%0A'
            Write-Output "::error title=direct server failed (exit $($p.ExitCode))::$t"
            exit 1
          }
      - name: Launch tray like a user
        if: always()
        shell: pwsh
        run: |
          $env:APPDATA = 'C:\测试 用户\Roaming'; New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          Start-Process -FilePath (Join-Path $env:INSTALL 'pi-assistant-tray.exe')
          $ok = $false
          for ($i = 0; $i -lt 150 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/api/system/public -TimeoutSec 3).StatusCode -eq 200 } catch {}
          }
          $logs = Join-Path $env:LOCALAPPDATA 'com.piassistant.app\logs'
          $log = ''
          if (Test-Path "$logs\server.log") { $log = Get-Content "$logs\server.log" -Raw; Write-Output $log }
          $procs = (Get-Process | Where-Object { $_.Name -match 'node|pi-assistant' } | ForEach-Object { "$($_.Name) $($_.Id)" }) -join ', '
          Write-Output "processes: $procs"
          $crash = (Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
            Select-Object -First 3 | ForEach-Object { $_.Message.Substring(0, [Math]::Min(600, $_.Message.Length)) }) -join ' || '
          Write-Output "app errors: $crash"
          if (-not $ok) {
            $t = "[$env:TAG] processes: $procs`napp errors: $crash`n" + $(if ($log) { $log.Substring([Math]::Max(0, $log.Length - 2500)) } else { 'no server.log' })
            $t = $t -replace "`r?`n", '%0A'
            Write-Output "::error title=tray launch: server not healthy::$t"
            exit 1
          }
          Write-Output "tray launch OK"
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke-logs | Out-Null
          Copy-Item direct.out, direct.err smoke-logs -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $env:LOCALAPPDATA 'com.piassistant.app\logs\*') smoke-logs -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-smoke-logs-${{ strategy.job-index }}
          path: smoke-logs/
          if-no-files-found: ignore
