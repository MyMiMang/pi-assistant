# 每次 push / PR 扫描完整 git 历史中的密钥（gitleaks）。
name: secrets
on: [push, pull_request]
permissions: { contents: read }
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          V=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --no-banner -v .
