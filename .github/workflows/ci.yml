name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: 规范检查（行数、依赖边界、重复代码、文档、仓库卫生）
        run: npm run check:static
      - name: Pi 版本兼容检查
        run: npm run check:pi
      - run: npm run typecheck
      - name: 单元 + Pi 兼容性测试
        run: npm test
      - name: Rendezvous Worker 测试
        run: npm test -w @pi-assistant/rendezvous
      - run: npm run build
      - name: 端到端测试（Mock 模型 + 无头 Chrome）
        run: |
          npx playwright-core install chromium
          CHROME=$(node -e "console.log(require('playwright-core').chromium.executablePath())") node e2e/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: artifacts }
  # 固定在 desktop-image.json 里的助理电脑镜像：在 nerdctl + rootful containerd（同 Lima 虚拟机）下两种架构真实开机
  desktop-nerdctl:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, ubuntu-24.04-arm] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo env PATH="$PATH" scripts/smoke-desktop-nerdctl.sh "$(node -p 'const j=require("./packages/server/desktop-image.json");j.repository+"@"+j.digest')"
  # macOS 助理电脑（Lima）：托管的 macOS 运行器没有嵌套虚拟化，开不了 vz 虚拟机；
  # 这里验证真实下载 + SHA256 校验 limactl、生成的配置通过 `limactl validate`、Lima 相关单测（两种 CPU 架构）
  lima-macos:
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, macos-15-intel] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Lima 单测 + 真实 limactl validate
        working-directory: packages/server
        env: { PIA_LIMA_REAL: "1" }
        run: node --import tsx --test test/desktop-lima.test.ts test/desktop-runtime.test.ts
  # Windows 助理电脑（WSL2）：托管 Windows 运行器一般没有嵌套虚拟化，WSL2 起不来；
  # 这里验证 WSL 单测（保护 / 解析 / 提权命令 / host 网络参数）、真实 wsl.exe 探测与中文归类、真实下载并校验发布的 rootfs，
  # 运行器的 WSL2 恰好可用时再真实导入 / 启动容器引擎 / 注销
  wsl-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: WSL 单测 + Windows 实测
        working-directory: packages/server
        env: { PIA_WSL_REAL_DOWNLOAD: "1", PIA_WSL_TRY_IMPORT: "1" }
        run: node --import tsx --test --test-concurrency=1 test/desktop-wsl.test.ts test/desktop-runtime.test.ts test/desktop-wsl-windows.test.ts
