name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Pi 版本兼容检查
        run: npm run check:pi
      - run: npm run typecheck
      - name: 单元 + Pi 兼容性测试
        run: npm test
      - name: Rendezvous Worker 测试
        run: npm test -w @pi-assistant/rendezvous
      - run: npm run build
      - name: 端到端测试（Mock 模型 + 无头 Chrome）
        run: |
          npx playwright-core install chromium
          CHROME=$(node -e "console.log(require('playwright-core').chromium.executablePath())") node e2e/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: docs/screenshots }
  # macOS 助理电脑（Lima）：托管的 macOS 运行器没有嵌套虚拟化，开不了 vz 虚拟机；
  # 这里验证真实下载 + SHA256 校验 limactl、生成的配置通过 `limactl validate`、Lima 相关单测（两种 CPU 架构）
  lima-macos:
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, macos-13] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Lima 单测 + 真实 limactl validate
        working-directory: packages/server
        env: { PIA_LIMA_REAL: "1" }
        run: node --import tsx --test test/desktop-lima.test.ts test/desktop-runtime.test.ts
