# 打 v* tag 时构建安装包并发布到 GitHub Releases：
# tag / release-dryrun 的范围取 .github/release-scope.json（本轮 mac-arm64），手动 scope=all 可恢复多平台。
# mac-arm64 强制跳过 Windows、Linux、Intel；publish 校验 latest.json 仅含实际构建的 arm64 更新项。
#   macOS arm64 / x64 → .dmg（hdiutil 打包，非 Tauri bundle_dmg.sh）（+ .app.tar.gz 更新包），Windows x64 → NSIS .exe（+ 更新包）
# 安装包内容：Tauri 托盘程序 + 内置 Node 运行时（sidecar）+ app 目录（服务端 + Pi + 生产依赖 + 网页 + cloudflared/uv/cua-driver），
# Linux 服务器版 x64 / arm64 → pi-assistant-<版本>-linux-<arch>.tar.gz（+ .sha256），deploy/linux/install.sh 安装。
# 版本与 SHA256 全部以 third-party.json 为准。所有 v* tag（包括 v0.2.0-beta.1 这类测试版）都发布为正式的 latest 版本：Tauri 自动更新读 releases/latest/download/latest.json，pre-release 不算 latest，会导致更新失效。
# 先发草稿、验证通过才公开：prepare 建草稿 → build / linux 把安装包和 latest.json 传进草稿 → windows-smoke（静默安装刚构建的 setup.exe 到中文路径，启动托盘查 /api）
# 和 mac-smoke（挂载 dmg 启动 .app 查 /api）→ 都通过才 publish（取消草稿、标 Latest）。草稿里的 latest.json 对自动更新不可见，任一步失败 Release 留在草稿，用户收不到。
# 演练：推送到 release-dryrun 分支（或手动运行）会用 v0.0.0-dryrun.<run> 走完整流程，但不公开，最后自动删掉草稿。
# Intel Mac（x86_64）默认不构建：耗时很久且长期失败（见 docs/ROADMAP.md「暂缓」）。恢复方式二选一：
#   1) 手动运行本 workflow 时勾选 build_intel；2) 设置仓库变量 BUILD_INTEL=true（Settings › Secrets and variables › Actions › Variables）。
# 跳过 Intel 时 latest.json 不含 darwin-x86_64，Intel 老用户不会被错误引到 arm 包（只停更，不会装错）。
# 自动更新签名：仓库 secrets 设置 TAURI_SIGNING_PRIVATE_KEY（+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD）后生成 latest.json 与 .sig；
# 没设置时照常出安装包，只是不带自动更新文件。暂不做 Apple 公证 / Windows 代码签名（见 docs/INSTALL.md）。
name: release
on:
  push: { tags: ["v*"], branches: [release-dryrun] }
  workflow_dispatch:
    inputs:
      scope:
        description: 发布平台范围（tag 使用 .github/release-scope.json）
        type: choice
        options: [mac-arm64, all]
        default: mac-arm64
      build_intel:
        description: 同时构建 Intel Mac（x86_64，默认关闭）
        type: boolean
        default: false
permissions: { contents: write }
env:
  REL_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.0-dryrun.{0}', github.run_number) }}
  # Intel Mac 开关：手动触发看输入，其余触发看仓库变量 BUILD_INTEL（小写 true）。
  BUILD_INTEL: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_intel) || vars.BUILD_INTEL == 'true' }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      scope: ${{ steps.matrix.outputs.scope }}
      build_linux: ${{ steps.matrix.outputs.build_linux }}
      build_windows: ${{ steps.matrix.outputs.build_windows }}
      build_intel: ${{ steps.matrix.outputs.build_intel }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: matrix
        name: 按发布范围组装矩阵
        env: { RELEASE_SCOPE: "${{ inputs.scope }}" }
        run: node scripts/release-scope.mjs >> "$GITHUB_OUTPUT"
      - name: 建草稿 Release（已有草稿就复用；已经公开的版本不再重发）
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if [ "$(gh release view "$REL_TAG" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then echo "::error::$REL_TAG 已经公开发布过"; exit 1; fi
          if ! gh release view "$REL_TAG" >/dev/null 2>&1; then
            bash scripts/release-notes.sh "$REL_TAG" > notes.md
            gh release create "$REL_TAG" --draft --target "$GITHUB_SHA" --title "Pi Assistant $REL_TAG" --notes-file notes.md
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 更新说明（Release 正文 + latest.json notes）
        shell: bash
        run: |
          { echo 'RELEASE_NOTES<<PIA_EOF'; bash scripts/release-notes.sh "$REL_TAG"; echo 'PIA_EOF'; } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "apps/tray/src-tauri -> target" }
      - name: 版本号取自 tag
        shell: bash
        run: |
          V="${REL_TAG#v}"
          node -e "const f='apps/tray/src-tauri/tauri.conf.json';const j=require('./'+f);j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$V"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: 内置 Node 运行时 + app 目录 + 第三方二进制
        run: node apps/tray/scripts/build-sidecar.mjs ${{ matrix.target }}
      - name: 冒烟测试（用安装包里的 Node 启动服务）
        shell: bash
        run: node scripts/smoke-app.mjs apps/tray/src-tauri/binaries/node-${{ matrix.target }}$([ "$RUNNER_OS" = Windows ] && echo .exe) dist-app
      - name: 没有更新签名密钥时不生成更新包
        if: env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > apps/tray/src-tauri/tauri.nosign.json
      # macOS 只让 Tauri 出 .app（+ .app.tar.gz/.sig 更新包，latest.json 的 darwin 项照常生成），
      # dmg 由下一步用 hdiutil 直接打：Tauri 自带的 bundle_dmg.sh 在 macos-15-intel runner 上反复失败/卡住（beta.9–14 都缺 x64.dmg）。
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/tray
          tauriScript: npx tauri
          args: --verbose --target ${{ matrix.target }} ${{ runner.os == 'macOS' && '--bundles app' || '' }} ${{ env.HAS_UPDATER_KEY != 'true' && '--config src-tauri/tauri.nosign.json' || '' }}
          tagName: ${{ env.REL_TAG }}
          releaseName: "Pi Assistant ${{ env.REL_TAG }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
      - name: macOS：用 hdiutil 打 dmg 并传进草稿（Tauri 同名：Pi.Assistant_<版本>_<x64|aarch64>.dmg）
        if: runner.os == 'macOS'
        timeout-minutes: 20
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_REPO: "${{ github.repository }}" }
        run: |
          set -euxo pipefail
          B="apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle"
          ls -la "$B/macos"
          APP=$(ls -d "$B"/macos/*.app | head -1)
          if [ "$HAS_UPDATER_KEY" = true ]; then ls "$B"/macos/*.app.tar.gz "$B"/macos/*.app.tar.gz.sig; fi
          ARCH=$([ "${{ matrix.target }}" = x86_64-apple-darwin ] && echo x64 || echo aarch64)
          NAME=$(basename "$APP" .app)
          mkdir -p "$B/dmg"; OUT="$B/dmg/${NAME// /.}_${REL_TAG#v}_${ARCH}.dmg"
          S=$(mktemp -d); cp -R "$APP" "$S/"; ln -s /Applications "$S/Applications"
          ok=
          for i in 1 2 3; do
            rm -f "$OUT"
            if hdiutil create -volname "$NAME" -srcfolder "$S" -ov -format UDZO "$OUT"; then ok=1; break; fi
            hdiutil info || true; sleep 15
          done
          [ -n "$ok" ] && hdiutil verify "$OUT"
          gh release upload "$REL_TAG" "$OUT" --clobber
          gh release view "$REL_TAG" --json assets -q '.assets[].name'
      - uses: actions/upload-artifact@v4
        with:
          name: pi-assistant-${{ matrix.label }}
          path: |
            apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz*
            apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
          if-no-files-found: error

  linux:
    needs: prepare
    if: needs.prepare.outputs.build_linux == 'true'
    # Linux 服务器版发布包：内置 Node + app 目录 + 命令行包装 + 安装脚本（见 scripts/package-linux.mjs）
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: 版本号取自 tag
        run: |
          V="${REL_TAG#v}"
          node -e "const f='apps/tray/src-tauri/tauri.conf.json';const j=require('./'+f);j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$V"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/package-linux.mjs
      - name: 冒烟测试（解压发布包，用 install.sh 装成当前用户、不注册服务，前台启动）
        run: |
          set -eux
          F=$(ls dist-linux/*.tar.gz)
          HOME=$(mktemp -d) sh -c "sh deploy/linux/install.sh --user --file $F --no-start && ls \$HOME/.local/share/pi-assistant/current/"
          tar -xzf "$F" -C "$RUNNER_TEMP"
          D=$(ls -d "$RUNNER_TEMP"/pi-assistant-*-linux-${{ matrix.arch }})
          node scripts/smoke-app.mjs "$D/node" "$D/app"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-assistant-Linux-${{ matrix.arch }}
          path: dist-linux/*.tar.gz*
      - name: 上传到草稿 Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload "$REL_TAG" dist-linux/*.tar.gz dist-linux/*.tar.gz.sha256 --clobber

  # 用刚构建、还在草稿里的安装包做真机冒烟；通过前不公开
  windows-smoke:
    needs: [prepare, build]
    if: needs.prepare.outputs.build_windows == 'true'
    uses: ./.github/workflows/windows-smoke.yml
    with: { artifact: pi-assistant-Windows-x64 }

  mac-smoke:
    needs: [prepare, build]
    env:
      BUILD_INTEL: ${{ needs.prepare.outputs.build_intel }}
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: pi-assistant-macOS-arm64, path: art }
      - uses: actions/download-artifact@v4
        if: env.BUILD_INTEL == 'true'
        with: { name: pi-assistant-macOS-x64, path: art-x64 }
      - name: Intel 版 dmg 能挂载、里面有 .app 和更新包
        if: env.BUILD_INTEL == 'true'
        run: |
          set -x
          DMG=$(find art-x64 -name '*_x64.dmg' | head -1); test -n "$DMG"
          hdiutil attach -nobrowse -mountpoint /tmp/pia-x64 "$DMG"
          ls -d /tmp/pia-x64/*.app && file /tmp/pia-x64/*.app/Contents/MacOS/pi-assistant-tray | grep x86_64
          hdiutil detach /tmp/pia-x64 || hdiutil detach -force /tmp/pia-x64
          find art-x64 -name '*.app.tar.gz*'
      - name: 挂载 dmg，启动 .app，查服务
        run: |
          set -x
          DMG=$(find art -name '*.dmg' | head -1)
          hdiutil attach -nobrowse -mountpoint /tmp/pia "$DMG"
          mkdir -p "$HOME/Applications" && cp -R /tmp/pia/*.app "$HOME/Applications/"
          APP=$(ls -d "$HOME"/Applications/*.app | head -1)
          file "$APP/Contents/MacOS/pi-assistant-tray" | grep arm64
          xattr -dr com.apple.quarantine "$APP" || true
          "$APP/Contents/MacOS/pi-assistant-tray" > tray.log 2>&1 &
          for i in $(seq 1 150); do curl -fsS http://127.0.0.1:8787/api/system/public >/dev/null 2>&1 && { echo "mac launch OK"; exit 0; }; sleep 1; done
          LOG="$HOME/Library/Logs/com.piassistant.app/server.log"
          cat tray.log; [ -f "$LOG" ] && tail -60 "$LOG"
          echo "::error title=mac launch: server not healthy::$( (tail -30 "$LOG" 2>/dev/null || tail -30 tray.log) | tr '\n' '|')"
          exit 1

  publish:
    needs: [prepare, build, linux, windows-smoke, mac-smoke]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.prepare.result == 'success' && needs.build.result == 'success' && needs.mac-smoke.result == 'success' &&
      (needs.linux.result == 'success' || (needs.prepare.outputs.build_linux == 'false' && needs.linux.result == 'skipped')) &&
      (needs.windows-smoke.result == 'success' || (needs.prepare.outputs.build_windows == 'false' && needs.windows-smoke.result == 'skipped'))
    runs-on: ubuntu-latest
    env:
      RELEASE_SCOPE: ${{ needs.prepare.outputs.scope }}
      BUILD_INTEL: ${{ needs.prepare.outputs.build_intel }}
    steps:
      - uses: actions/checkout@v4
      - name: 全部通过 → 公开并标为 Latest（latest.json 这时才对自动更新可见）
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_REPO: "${{ github.repository }}" }
        run: |
          gh release view "$REL_TAG" --json assets -q '.assets[].name' | tee assets.txt
          gh release download "$REL_TAG" -p latest.json -O latest.json
          # 校验构建范围、资产和平台更新项，重写草稿临时地址；失败保持草稿。
          node scripts/release-scope.mjs validate
          grep -o '"url": *"[^"]*"' latest.json
          gh release upload "$REL_TAG" latest.json --clobber
          gh release edit "$REL_TAG" --draft=false --prerelease=false --latest

  cleanup-dry-run:
    needs: [prepare, build, linux, windows-smoke, mac-smoke]
    if: always() && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 演练结束，删除草稿（从未公开，tag 也不会留下）
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_REPO: "${{ github.repository }}" }
        run: |
          echo "build=${{ needs.build.result }} linux=${{ needs.linux.result }} windows-smoke=${{ needs.windows-smoke.result }} mac-smoke=${{ needs.mac-smoke.result }}"
          gh release view "$REL_TAG" --json assets -q '.assets[].name' || true
          gh release delete "$REL_TAG" --yes --cleanup-tag || true
