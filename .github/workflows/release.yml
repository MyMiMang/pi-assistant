# 打 v* tag 时构建安装包并发布到 GitHub Releases：
#   macOS arm64 / x64 → .dmg（+ .app.tar.gz 更新包），Windows x64 → NSIS .exe（+ 更新包）
# 安装包内容：Tauri 托盘程序 + 内置 Node 运行时（sidecar）+ app 目录（服务端 + Pi + 生产依赖 + 网页 + cloudflared/uv/cua-driver），
# Linux 服务器版 x64 / arm64 → pi-assistant-<版本>-linux-<arch>.tar.gz（+ .sha256），deploy/linux/install.sh 安装。
# 版本与 SHA256 全部以 third-party.json 为准。所有 v* tag（包括 v0.2.0-beta.1 这类测试版）都发布为正式的 latest 版本：Tauri 自动更新读 releases/latest/download/latest.json，pre-release 不算 latest，会导致更新失效。
# 自动更新签名：仓库 secrets 设置 TAURI_SIGNING_PRIVATE_KEY（+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD）后生成 latest.json 与 .sig；
# 没设置时照常出安装包，只是不带自动更新文件。暂不做 Apple 公证 / Windows 代码签名（见 docs/INSTALL.md）。
name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, label: macOS-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, label: macOS-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, label: Windows-x64 }
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 更新说明（Release 正文 + latest.json notes）
        shell: bash
        run: |
          { echo 'RELEASE_NOTES<<PIA_EOF'; bash scripts/release-notes.sh "$GITHUB_REF_NAME"; echo 'PIA_EOF'; } >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "apps/tray/src-tauri -> target" }
      - name: 版本号取自 tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='apps/tray/src-tauri/tauri.conf.json';const j=require('./'+f);j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$V"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: 内置 Node 运行时 + app 目录 + 第三方二进制
        run: node apps/tray/scripts/build-sidecar.mjs ${{ matrix.target }}
      - name: 冒烟测试（用安装包里的 Node 启动服务）
        shell: bash
        run: node scripts/smoke-app.mjs apps/tray/src-tauri/binaries/node-${{ matrix.target }}$([ "$RUNNER_OS" = Windows ] && echo .exe) dist-app
      - name: 没有更新签名密钥时不生成更新包
        if: env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > apps/tray/src-tauri/tauri.nosign.json
      - name: macOS：避免 hdiutil 卡住（Intel runner 上 XProtect/Spotlight 扫描大 .app 会让 bundle_dmg.sh 挂起）
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true
          (for i in $(seq 1 600); do sudo pkill -9 XProtect >/dev/null 2>&1 || true; sleep 3; done) &
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        continue-on-error: ${{ runner.os == 'macOS' }}
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/tray
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} ${{ env.HAS_UPDATER_KEY != 'true' && '--config src-tauri/tauri.nosign.json' || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Pi Assistant ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
      - name: macOS 打包失败时重试一次（打 dmg 偶发卡住）
        if: steps.tauri.outcome == 'failure'
        run: rm -rf apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle/dmg
      - uses: tauri-apps/tauri-action@v0
        id: tauri_retry
        if: steps.tauri.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/tray
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} ${{ env.HAS_UPDATER_KEY != 'true' && '--config src-tauri/tauri.nosign.json' || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Pi Assistant ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
      - uses: actions/upload-artifact@v4
        with:
          name: pi-assistant-${{ matrix.label }}
          path: |
            apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz*
            apps/tray/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
          if-no-files-found: warn

  linux:
    # Linux 服务器版发布包：内置 Node + app 目录 + 命令行包装 + 安装脚本（见 scripts/package-linux.mjs）
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: 版本号取自 tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='apps/tray/src-tauri/tauri.conf.json';const j=require('./'+f);j.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "$V"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/package-linux.mjs
      - name: 冒烟测试（解压发布包，用 install.sh 装成当前用户、不注册服务，前台启动）
        run: |
          set -eux
          F=$(ls dist-linux/*.tar.gz)
          HOME=$(mktemp -d) sh -c "sh deploy/linux/install.sh --user --file $F --no-start && ls \$HOME/.local/share/pi-assistant/current/"
          tar -xzf "$F" -C "$RUNNER_TEMP"
          D=$(ls -d "$RUNNER_TEMP"/pi-assistant-*-linux-${{ matrix.arch }})
          node scripts/smoke-app.mjs "$D/node" "$D/app"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-assistant-Linux-${{ matrix.arch }}
          path: dist-linux/*.tar.gz*
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Pi Assistant $GITHUB_REF_NAME" --notes "安装说明见 docs/INSTALL.md" --latest
          gh release upload "$GITHUB_REF_NAME" dist-linux/*.tar.gz dist-linux/*.tar.gz.sha256 --clobber
          gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest  # 保证是 latest（自动更新依赖）
