# Pi Assistant 自有发行版：与 Windows 隔离
[automount]
# 不挂载 C: 等 Windows 磁盘（助理电脑碰不到你的文件）
enabled = false
mountFsTab = false
[interop]
# 发行版里不能启动 Windows 程序，也不继承 Windows 的 PATH
enabled = false
appendWindowsPath = false
[user]
default = root
[boot]
systemd = false
[network]
generateResolvConf = true
hostname = PiAssistant-Desktop
